<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Pokemon</title>
</head>
<body>
    <header></header>
    <main>
        <form id="form1">
            <h3>Buscar pokemon por ID</h3>

            <label for="inputNumber">Introduce el numero de pokedex</label>
            <input class="inputNumber" type="number" id="inputNumber">

            <button type="submit">Buscar</button>

            <label for="inputName">Nombre del pokemon</label>
            <input class="inputName" type="text" id="inputName">
        </form>
        <br>
        <div>
            <h3>Todos los pokemon (10)</h3>

            <input type="text" id="pokemon1">
            <input type="text" id="pokemon2">
            <input type="text" id="pokemon3">
            <input type="text" id="pokemon4">
            <input type="text" id="pokemon5">
            <input type="text" id="pokemon6">
            <input type="text" id="pokemon7">
            <input type="text" id="pokemon8">
            <input type="text" id="pokemon9">
            <input type="text" id="pokemon10">

            <button type="button" id="btnAllPokemons">
                Cargar pokemon
            </button>
        </div>
        <br>
        <div>
            <h3>Pokemon por habilidad</h3>

            <label for="inputAbilityName">Nombre de la habilidad</label>
            <input type="text" id="inputAbilityName">

            <button type="button" id="btnAbility">
                Buscar
            </button>

            <input type="text" id="abilityPokemon1">
            <input type="text" id="abilityPokemon2">
            <input type="text" id="abilityPokemon3">
            <input type="text" id="abilityPokemon4">
            <input type="text" id="abilityPokemon5">
            <input type="text" id="abilityPokemon6">
            <input type="text" id="abilityPokemon7">
            <input type="text" id="abilityPokemon8">
            <input type="text" id="abilityPokemon9">
            <input type="text" id="abilityPokemon10">
        </div>
        <br>
        <div>
            <h3>Pokemon por tipo</h3>

            <label for="inputTypeName">Nombre del tipo</label>
            <input type="text" id="inputTypeName">

            <button type="button" id="btnType">
                Buscar
            </button>

            <input type="text" id="typePokemon1">
            <input type="text" id="typePokemon2">
            <input type="text" id="typePokemon3">
            <input type="text" id="typePokemon4">
            <input type="text" id="typePokemon5">
            <input type="text" id="typePokemon6">
            <input type="text" id="typePokemon7">
            <input type="text" id="typePokemon8">
            <input type="text" id="typePokemon9">
            <input type="text" id="typePokemon10">
        </div>
        <br>
        <div>
            <h3>Habilidad de un pokemon</h3>

            <label for="inputAbilityPokemonId">ID pokemon</label>
            <input type="number" id="inputAbilityPokemonId">

            <label for="inputAbilityPokemonName">Habilidad</label>
            <input type="text" id="inputAbilityPokemonName">

            <button type="button" id="btnPokemonAbility">
                Buscar
            </button>

            <input type="text" id="pokemonAbilityResult">
        </div>
    </main>
    <footer>
        <script src="./scripts.js"></script>
    </footer>
</body>
</html>
